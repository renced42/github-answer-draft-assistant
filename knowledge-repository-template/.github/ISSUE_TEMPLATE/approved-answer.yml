name: Ellenőrzött válasz rögzítése
description: Ember által ellenőrzött válasz felvétele a választervezet tudástárába
title: "[KNOWLEDGE] "
labels:
  - knowledge-candidate
body:
  - type: markdown
    attributes:
      value: |
        Ez az űrlap manuálisan ellenőrzött tudás rögzítésére szolgál. A létrehozás után csak akkor add hozzá az `approved-knowledge` címkét, ha a válasz és minden forrás ellenőrzött, valamint az adat átadható a konfigurált külső AI-szolgáltatónak.

  - type: dropdown
    id: system
    attributes:
      label: Azonosított rendszer
      options:
        - eNyugta
        - eÁFA
        - Online Számla
        - Online pénztárgép
        - Egyéb
    validations:
      required: true

  - type: input
    id: original-url
    attributes:
      label: Eredeti kérdés URL-je
      placeholder: https://github.com/owner/repository/issues/123
    validations:
      required: false

  - type: textarea
    id: question
    attributes:
      label: Eredeti kérdés
      description: A kérdés pontos szövege, amelyre az ellenőrzött válasz vonatkozik.
    validations:
      required: true

  - type: textarea
    id: approved-answer
    attributes:
      label: Ellenőrzött végleges válasz
      description: Csak az ember által szakmailag ellenőrzött szöveg kerüljön ide.
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Felhasznált források
      description: Közvetlen URL-enként egy sor, szükség esetén rövid megjegyzéssel.
      placeholder: |
        - https://github.com/nav-gov-hu/...
        - https://nav.gov.hu/...
    validations:
      required: true

  - type: checkboxes
    id: errors
    attributes:
      label: Az eredeti tervezetben javított problémák
      options:
        - label: Más NAV-rendszerrel keverte össze
        - label: Nem igazolt állítást tartalmazott
        - label: Nem vizsgálta meg a releváns XSD-t vagy specifikációt
        - label: Elavult forrást használt
        - label: Hibás vagy nem közvetlen hivatkozást adott

  - type: checkboxes
    id: approval
    attributes:
      label: Adatátadási ellenőrzés
      options:
        - label: Ellenőriztem, hogy a rögzített válasz és forrásai átadhatók a konfigurált külső AI-szolgáltatónak.
          required: true
