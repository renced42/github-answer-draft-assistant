name: "GitHub választervezet ChatGPT Workspace Agenttel"
description: "Workspace Agent futtatása és a ChatGPT-beszélgetés linkjének elküldése emailben"

inputs:
  event-kind:
    description: "issue vagy discussion"
    required: true
  repository:
    description: "Tulajdonos/repository"
    required: true
  number:
    description: "Issue vagy Discussion sorszáma"
    required: true
  title:
    description: "A kérdés címe"
    required: true
  body:
    description: "A kérdés szövege"
    required: false
    default: ""
  question-url:
    description: "Az eredeti GitHub-kérdés URL-je"
    required: true
  author:
    description: "A kérdező GitHub-neve"
    required: false
    default: "ismeretlen"
  email-to:
    description: "Címzettek vesszővel elválasztva"
    required: true
  workspace-agent-trigger-id:
    description: "A közzétett Workspace Agent triggerazonosítója (agtch_...)"
    required: true
  poll-timeout-seconds:
    description: "Legfeljebb ennyi ideig vár az Agentre"
    required: false
    default: "900"

runs:
  using: composite
  steps:
    - name: Java 21 beállítása
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Java alkalmazás fordítása
      shell: bash
      run: |
        BUILD_DIR="${RUNNER_TEMP}/github-answer-workspace-agent"
        mkdir -p "${BUILD_DIR}"
        find "${GITHUB_ACTION_PATH}/src/main/java" -name '*.java' -print0 \
          | xargs -0 javac --release 21 -encoding UTF-8 -d "${BUILD_DIR}"

    - name: Választervezet indítása és email küldése
      shell: bash
      env:
        ASSISTANT_EVENT_KIND: ${{ inputs.event-kind }}
        ASSISTANT_REPOSITORY: ${{ inputs.repository }}
        ASSISTANT_NUMBER: ${{ inputs.number }}
        ASSISTANT_TITLE: ${{ inputs.title }}
        ASSISTANT_BODY: ${{ inputs.body }}
        ASSISTANT_QUESTION_URL: ${{ inputs.question-url }}
        ASSISTANT_AUTHOR: ${{ inputs.author }}
        ASSISTANT_EMAIL_TO: ${{ inputs.email-to }}
        WORKSPACE_AGENT_TRIGGER_ID: ${{ inputs.workspace-agent-trigger-id }}
        ASSISTANT_POLL_TIMEOUT_SECONDS: ${{ inputs.poll-timeout-seconds }}
      run: |
        java -cp "${RUNNER_TEMP}/github-answer-workspace-agent" \
          hu.gov.nav.answerdraft.Main
