name: "GitHub Answer Draft Assistant – Java + Groq"
description: "Nyilvános NAV-forrásokból választervezetet készít és emailben elküldi. GitHubra nem publikál."

inputs:
  organization:
    description: "A forráskeresés GitHub organizationje"
    required: false
    default: "nav-gov-hu"
  event-kind:
    description: "issue vagy discussion"
    required: true
  repository:
    description: "A kérdést tartalmazó owner/repository"
    required: true
  number:
    description: "Az Issue vagy Discussion sorszáma"
    required: true
  title:
    description: "A kérdés címe"
    required: true
  body:
    description: "A kérdés szövege"
    required: false
    default: ""
  question-url:
    description: "Az eredeti GitHub-kérdés URL-je"
    required: true
  author:
    description: "A kérdés szerzőjének GitHub-neve"
    required: false
    default: "ismeretlen"
  email-to:
    description: "Vesszővel elválasztott email-címzettek"
    required: true
  groq-model:
    description: "A Groq modellen belüli modellazonosító"
    required: false
    default: "openai/gpt-oss-120b"
  nav-gov-hu-search:
    description: "Keressen-e a nyilvános nav.gov.hu oldalakon"
    required: false
    default: "true"
  browser-search:
    description: "Használja-e a Groq beépített böngészős keresését"
    required: false
    default: "true"
  dry-run:
    description: "Email helyett csak a workflow-naplóba írja a tervezetet"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Java 21 beállítása
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Java alkalmazás fordítása
      shell: bash
      run: |
        BUILD_DIR="${RUNNER_TEMP}/github-answer-draft-assistant"
        rm -rf "${BUILD_DIR}"
        mkdir -p "${BUILD_DIR}"
        find "${GITHUB_ACTION_PATH}/src/main/java" -name '*.java' -print0 \
          | xargs -0 javac --release 21 -encoding UTF-8 -d "${BUILD_DIR}"

    - name: Választervezet elkészítése és elküldése
      shell: bash
      env:
        ASSISTANT_ORGANIZATION: ${{ inputs.organization }}
        ASSISTANT_EVENT_KIND: ${{ inputs.event-kind }}
        ASSISTANT_REPOSITORY: ${{ inputs.repository }}
        ASSISTANT_NUMBER: ${{ inputs.number }}
        ASSISTANT_TITLE: ${{ inputs.title }}
        ASSISTANT_BODY: ${{ inputs.body }}
        ASSISTANT_QUESTION_URL: ${{ inputs.question-url }}
        ASSISTANT_AUTHOR: ${{ inputs.author }}
        ASSISTANT_EMAIL_TO: ${{ inputs.email-to }}
        ASSISTANT_GROQ_MODEL: ${{ inputs.groq-model }}
        ASSISTANT_NAV_SEARCH: ${{ inputs.nav-gov-hu-search }}
        ASSISTANT_BROWSER_SEARCH: ${{ inputs.browser-search }}
        ASSISTANT_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        java -cp "${RUNNER_TEMP}/github-answer-draft-assistant" \
          hu.gov.nav.answerdraft.Main
